<main class="home">
  <header class="intro"><h1><strong>Jalal</strong> Mashhadi Fard</h1><p>Architect · Artist · Creative Director · Designer</p></header>
  <section *ngFor="let section of sections;let si=index" class="project-section" [class.primary]="si===0" [class.reverse]="si%2">
    <header class="section-head"><span>{{section.index}}</span><h2>{{section.title}}</h2><a [routerLink]="section.route">View all ↗</a></header>
    <div class="project-stage">
      <a class="featured" [class.is-turning]="turning[section.key]" [routerLink]="[section.route,featured(section).id]">
        <div class="cover image-new" [class.split]="featured(section).coverImages?.length">
          <ng-container *ngIf="featured(section).coverImages?.length;else single">
            <img *ngFor="let image of featured(section).coverImages" [src]="image" [alt]="featured(section).title">
          </ng-container>
          <ng-template #single><img [src]="featured(section).src" [alt]="featured(section).title" [style.object-position]="featured(section).coverPosition||'50% 50%'"></ng-template>
        </div>
        <div class="cover image-old" *ngIf="turning[section.key]"><img [src]="previousFeatured(section).src" alt=""></div>
        <span class="featured-title">{{featured(section).title}}</span><span class="open-project">Open project ↗</span>
      </a>
      <nav class="project-index" [attr.aria-label]="section.title+' projects'">
        <a *ngFor="let project of section.projects;let pi=index" [routerLink]="[section.route,project.id]"
          [class.active]="selected[section.key]===pi" (mouseenter)="select(section,pi)" (focus)="select(section,pi)">
          <img [src]="project.src" [alt]="project.title"><span class="project-number">{{pi+1}}</span><span class="project-name">{{project.title}}</span>
        </a>
      </nav>
    </div>
  </section>
  <a class="awards-strip" routerLink="/awards"><span>Awards</span><strong>{{awards[currentAward]}}</strong><small>{{currentAward+1}} / {{awards.length}}</small></a>
</main>
