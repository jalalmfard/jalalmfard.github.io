<main class="home-portals">
  <section class="portal-grid" [attr.aria-label]="'Selected disciplines' | localize">
    <a *ngFor="let card of cards;let i=index" class="portal-card" [class.architecture]="i===0" [class.artworks]="card.key==='artworks'" [class.is-changing]="card.changing" [routerLink]="card.route">
      <img class="portal-image current" [class.focused-artwork]="current(card).focused" [src]="current(card).src" [alt]="(card.title) | localize" [style.object-position]="current(card).position">
      <img *ngIf="card.changing" class="portal-image previous" [class.focused-artwork]="old(card).focused" [src]="old(card).src" alt="" [style.object-position]="old(card).position">
      <span class="glass-surface"></span>
      <span class="portal-title">{{ (card.title) | localize }}<i>↗</i></span>
    </a>
  </section>

  <a class="awards-rail" routerLink="/awards" [attr.aria-label]="'Awards and recognition' | localize">
    <span class="awards-label">{{ "Awards" | localize }}</span>
    <span class="marquee"><span class="marquee-track"><ng-container *ngFor="let award of awardMarks"><span class="award-mark"><span class="award-logo" [class.dark]="award.dark"><img *ngIf="award.logoSrc" [src]="award.logoSrc" [alt]="(award.name) | localize"><b *ngIf="!award.logoSrc">{{ (award.logoText) | localize }}</b></span><small>{{ (award.name) | localize }}</small></span></ng-container><ng-container *ngFor="let award of awardMarks"><span class="award-mark"><span class="award-logo" [class.dark]="award.dark"><img *ngIf="award.logoSrc" [src]="award.logoSrc" [alt]="(award.name) | localize"><b *ngIf="!award.logoSrc">{{ (award.logoText) | localize }}</b></span><small>{{ (award.name) | localize }}</small></span></ng-container></span></span>
    <span class="awards-arrow">↗</span>
  </a>
</main>
