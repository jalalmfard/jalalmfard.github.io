<div class="home-portals">
  <button type="button" class="motion-toggle" (click)="toggleMotion()" [attr.aria-pressed]="motionPaused" [attr.aria-label]="(motionPaused ? 'Play slideshow' : 'Pause slideshow') | localize" [attr.title]="(motionPaused ? 'Play slideshow' : 'Pause slideshow') | localize">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path *ngIf="!motionPaused" d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="2"/><path *ngIf="motionPaused" d="m8 5 11 7-11 7z" fill="currentColor"/></svg>
  </button>
  <section class="portal-grid" [attr.aria-label]="'Selected disciplines' | localize" (mouseenter)="hoverPaused=true" (mouseleave)="hoverPaused=false" (focusin)="focusPaused=true" (focusout)="focusPaused=false">
    <a *ngFor="let card of cards;let i=index" class="portal-card" [class.architecture]="i===0" [class.artworks]="card.key==='artworks'" [class.is-changing]="card.changing" [routerLink]="card.route">
      <img class="portal-image current" [class.focused-artwork]="current(card).focused" [src]="current(card).src" alt="" [attr.fetchpriority]="i===0 ? 'high' : 'auto'" decoding="async" [style.object-position]="current(card).position">
      <img *ngIf="card.changing" class="portal-image previous" [class.focused-artwork]="old(card).focused" [src]="old(card).src" alt="" [style.object-position]="old(card).position">
      <span class="glass-surface"></span>
      <span class="portal-title"><span>{{ card.title | localize }}</span><i aria-hidden="true">↗</i></span>
    </a>
  </section>
  <a class="awards-rail" routerLink="/awards" [attr.aria-label]="'Awards and recognition' | localize">
    <span class="awards-label">{{ "Awards" | localize }}</span>
    <span class="award-names"><span class="award-mark" *ngFor="let award of awardMarks"><span class="award-logo" [class.dark]="award.dark"><img *ngIf="award.logoSrc" [src]="award.logoSrc" alt="" loading="lazy" (error)="$any($event.target).parentElement.hidden = true"><b *ngIf="!award.logoSrc">{{ award.logoText | localize }}</b></span><span>{{ award.name | localize }}</span></span></span>
    <span class="awards-arrow" aria-hidden="true">↗</span>
  </a>
</div>
