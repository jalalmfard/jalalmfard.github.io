<div *ngIf="selectedItem">
  <div class="card-container p-10"><h1>{{ (selectedItem.title) | localize }}</h1></div>
  <br>
  <div class="card-container p-10">
    <p>{{ (selectedItem.description) | localize }}</p>
    <p *ngIf="selectedItem.descriptionFa && localization.language === 'en'" dir="rtl" lang="fa">{{ (selectedItem.descriptionFa) | localize }}</p>
  </div>
  <br>
  <div *ngIf="selectedItem.images">
    <div class="card-container" *ngFor="let slide of selectedItem.images">
      <div id="frame"><div id="border" *ngIf="!slide.isvideo"><img class="show-image" [src]="slide.src" [alt]="(selectedItem.title) | localize"></div></div>
      <br><br>
    </div>
  </div>
</div>
