<div class="card-container p-10"><h1>Product Design</h1></div>
<div class="card-container" *ngFor="let slide of slides">
  <div class="main"><div><div class="title">{{slide.title}}</div><div class="location">{{slide.location}}</div></div>
    <div><div class="image"><div id="frame"><div id="border" *ngIf="!slide.isvideo"><img class="image" [src]="slide.src" [alt]="slide.title"></div></div></div>
      <div class="link"><button class="button-more" [routerLink]="['/furnituredesign/'+slide.id]" role="button">view project ↗</button></div>
    </div>
  </div>
</div>
