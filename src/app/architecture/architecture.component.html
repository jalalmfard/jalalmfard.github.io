
<div class="card-container p-10">

    <h1>Architecture & Interior design</h1>

</div>
<div class="card-container"*ngFor="let slide of slides" >
    <div class="main">
        <div>
            <div class="title">
                {{slide.title}}
            </div>
            <div class="location">
                {{slide.location}}  
            </div>
            <div class="project-status" *ngIf="slide.status">{{ slide.status }}</div>
        </div>

        <div>
            <div class="image">
                <div id="frame">
                    <div id="border">
                        <div class="split-cover" *ngIf="slide.coverImages?.length === 2; else singleCover">
                            <img [src]="slide.coverImages[0]" [alt]="slide.title + ' façade'" loading="lazy" [style.object-position]="slide.coverPositions ? slide.coverPositions[0] : null">
                            <img [src]="slide.coverImages[1]" [alt]="slide.title + ' interior'" loading="lazy" [style.object-position]="slide.coverPositions ? slide.coverPositions[1] : null">
                        </div>
                        <ng-template #singleCover><img class="project-cover" [src]="slide.src" [alt]="slide.title" loading="lazy" [style.object-position]="slide.coverPosition || null"></ng-template>
                    </div>
                </div>
            </div>
            <div class="link">
                <button class="button-more" [routerLink]="['/architecture/'+slide.id]" role="button">more ...</button>

            </div>
        </div>
    </div>
    
</div>
