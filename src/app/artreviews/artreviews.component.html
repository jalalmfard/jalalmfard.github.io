
<div class="card-container p-10">

    <h1>{{ "Art reviews" | localize }}</h1>

</div>
<div class="card-container"*ngFor="let slide of slides" >
    <div class="main">
        <div>
            <h2 class="title">
                {{ (slide.title) | localize }}
            </h2>
            <div class="location">
                {{ (slide.location) | localize }}
            </div>
        </div>

        <div>
            <div class="image">
                <div id="frame">
                    <div id="border">
                        <img loading="lazy" class="image" [src]="slide.src">
                    </div>
                </div>
            </div>
            <div class="link">
                <a class="button-more" [routerLink]="['/artreviews/'+slide.id]" [attr.aria-label]="('View project' | localize) + ': ' + (slide.title | localize)">{{ "more ..." | localize }}</a>

            </div>
        </div>
    </div>

</div>
