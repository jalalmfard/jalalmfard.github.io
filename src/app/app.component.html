<div class="content" role="main">
  <header class="site-header">
    <a class="wordmark" [routerLink]="['/']" aria-label="JalalMFard.com — Home">
      <strong>JalalMFard</strong>.com
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-controls="primary-navigation">
      <span>{{ menuOpen ? 'Close' : 'Menu' }}</span>
    </button>

    <nav class="foxnav" id="primary-navigation" [class.is-open]="menuOpen" aria-label="Primary navigation">
      <ul class="foxnav-items">
        <li class="foxnav-item"><a class="item-link" (click)="closeMenu()" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a></li>
        <li class="foxnav-item"><a class="item-link" (click)="closeMenu()" routerLink="/architecture" routerLinkActive="active">Architecture</a></li>
        <li class="foxnav-item"><a class="item-link" (click)="closeMenu()" routerLink="/fashion" routerLinkActive="active">Fashion</a></li>
        <li class="foxnav-item"><a class="item-link" (click)="closeMenu()" routerLink="/artworks" routerLinkActive="active">Artworks</a></li>
        <li class="foxnav-item"><a class="item-link" (click)="closeMenu()" routerLink="/exhibitions" routerLinkActive="active">Exhibitions</a></li>
        <li class="foxnav-item"><a class="item-link" (click)="closeMenu()" routerLink="/furnituredesign" routerLinkActive="active">Furniture</a></li>
        <li class="foxnav-item"><a class="item-link" (click)="closeMenu()" routerLink="/creative-direction" routerLinkActive="active">Creative Direction</a></li>
        <li class="foxnav-item"><a class="item-link" (click)="closeMenu()" routerLink="/awards" routerLinkActive="active">Awards</a></li>
        <li class="foxnav-item"><a class="item-link" (click)="closeMenu()" routerLink="/about" routerLinkActive="active">About</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-content"><router-outlet></router-outlet></main>

  <footer class="footer">
    <img src="/assets/images/jalal-arteza.png" class="sign" alt="Jalal Mashhadi Fard signature" />
    <span>© 2026 Jalal Mashhadi Fard</span>
    <a href="https://www.instagram.com/JalalMfard/" target="_blank" rel="noreferrer" aria-label="Instagram">
      <img class="instagram" src="/assets/images/instagram.svg" alt="" />
    </a>
  </footer>
</div>
