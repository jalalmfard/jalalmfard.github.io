
<div class="card-container p-10">

    <h1>{{ "Fashion" | localize }}</h1>

</div>
<div class="card-container"*ngFor="let slide of slides" >
    <div class="main">
        <div>
            <h2 class="title">
                {{ (slide.title) | localize }}
            </h2>
            <div class="location">
                {{ (slide.location) | localize }}
            </div>
        </div>

        <div>
            <div class="image" [class.image-placeholder]="!slide.src && !slide.coverImages?.length">
                <div id="frame">
                    <div id="border">
                        <div class="split-cover" *ngIf="slide.coverImages?.length; else singleCover">
                            <img *ngFor="let cover of slide.coverImages" [src]="cover" [alt]="(slide.title) | localize">
                        </div>
                        <ng-template #singleCover>
                            <img *ngIf="slide.src" class="image" [src]="slide.src" [alt]="(slide.title) | localize" [style.object-position]="slide.coverPosition || null">
                            <div *ngIf="!slide.src" class="placeholder-mark" aria-hidden="true">J</div>
                        </ng-template>
                    </div>
                </div>
            </div>
            <div class="link">
                <a class="button-more" [routerLink]="['/fashion/'+slide.id]" [attr.aria-label]="('View project' | localize) + ': ' + (slide.title | localize)">{{ "View project" | localize }}</a>

            </div>
        </div>
    </div>

</div>
