
<div class="card-container p-10">

    <h1>Fashion</h1>

</div>
<div class="card-container"*ngFor="let slide of slides" >
    <div class="main">
        <div>
            <div class="title">
                {{slide.title}}
            </div>
            <div class="location">
                {{slide.location}}
            </div>
        </div>

        <div>
            <div class="image" [class.image-placeholder]="!slide.src">
                <div id="frame">
                    <div id="border">
                        <img *ngIf="slide.src" class="image" [src]="slide.src" [alt]="slide.title">
                        <div *ngIf="!slide.src" class="placeholder-mark" aria-hidden="true">J</div>
                    </div>
                </div>
            </div>
            <div class="link">
                <button class="button-more" [routerLink]="['/fashion/'+slide.id]" role="button">more ...</button>

            </div>
        </div>
    </div>

</div>
