
<div class="card-container p-10">

    <h1>Fashion</h1>

</div>
<div class="card-container"*ngFor="let slide of slides" >
    <div class="main">
        <div>
            <div class="title">
                {{slide.title}}
            </div>
            <div class="location">
                {{slide.location}}
            </div>
        </div>

        <div>
            <div class="image" [class.image-placeholder]="!slide.src && !slide.coverImages?.length">
                <div id="frame">
                    <div id="border">
                        <div class="split-cover" *ngIf="slide.coverImages?.length; else singleCover">
                            <img *ngFor="let cover of slide.coverImages" [src]="cover" [alt]="slide.title">
                        </div>
                        <ng-template #singleCover>
                            <img *ngIf="slide.src" class="image" [src]="slide.src" [alt]="slide.title" [style.object-position]="slide.coverPosition || null">
                            <div *ngIf="!slide.src" class="placeholder-mark" aria-hidden="true">J</div>
                        </ng-template>
                    </div>
                </div>
            </div>
            <div class="link">
                <button class="button-more" [routerLink]="['/fashion/'+slide.id]" role="button">more ...</button>

            </div>
        </div>
    </div>

</div>
